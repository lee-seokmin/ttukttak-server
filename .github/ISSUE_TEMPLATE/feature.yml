name: 기능
description: 새로 만들거나 바꿀 걸 제안해요
labels: [enhancement]
body:
  - type: textarea
    id: why
    attributes:
      label: 왜 필요한가요
      description: 어떤 화면이나 흐름에서 필요한지 써주세요.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 무엇을 하나요
      description: API라면 메서드, 경로, 요청·응답 모양을 적어주세요. docs/api/README.md의 어느 절인지도 좋아요.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      placeholder: |
        - [ ] GET /api/v1/... 가 200으로 응답
        - [ ] 테스트 추가
