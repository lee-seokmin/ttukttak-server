name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write # 테스트 결과를 PR 체크에 올려요
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Gradle 캐시와 wrapper 검증. 캐시는 main에서만 쓰고 PR은 읽기만 해요.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # 컴파일, 테스트, 커버리지, bootJar까지. 테스트가 compose.yaml의 Postgres를 Docker로 띄워요.
      - run: ./gradlew build

      - name: 테스트 결과 요약
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: build/test-results/test/*.xml
          check_name: 테스트 결과
          detailed_summary: true

      - name: 커버리지 요약
        if: ${{ success() }}
        run: |
          awk -F, 'NR>1 {lm+=$8; lc+=$9; bm+=$6; bc+=$7}
            END {
              printf "### 커버리지\n\n| 라인 | 브랜치 |\n| --- | --- |\n"
              printf "| %.1f%% (%d/%d) | %.1f%% (%d/%d) |\n", lc*100/(lm+lc), lc, lm+lc, (bm+bc ? bc*100/(bm+bc) : 100), bc, bm+bc
            }' build/reports/jacoco/test/jacocoTestReport.csv >> "$GITHUB_STEP_SUMMARY"

      - name: 리포트 올리기
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test/html
          retention-days: 7

      # docker job(docker.yml)이 받아서 이미지로 만들어요.
      - name: jar 넘기기
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: build/libs/app.jar
          retention-days: 1

  # main에서 테스트가 통과하면 같은 실행 안에서 이미지를 만들어요.
  docker:
    if: ${{ github.event_name == 'push' }}
    needs: build
    permissions:
      contents: read
      packages: write # ghcr.io에 이미지 올리기
    uses: ./.github/workflows/docker.yml
