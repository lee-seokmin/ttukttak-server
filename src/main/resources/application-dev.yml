spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update # ponytail: Flyway 도입하면 validate로
    defer-datasource-initialization: true # Hibernate가 테이블을 만든 뒤에 db/patch.sql 실행
  sql:
    init:
      mode: always
      schema-locations: classpath:db/patch.sql

server:
  forward-headers-strategy: native # 프록시 뒤에서 https 콜백 주소를 만들어요
  servlet:
    session:
      cookie:
        secure: true
