# DB는 compose.yaml의 Postgres를 Docker Compose 연동이 자동으로 띄우고 연결해요.
spring:
  config:
    import: optional:file:.env[.properties] # GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET
  docker:
    compose:
      skip:
        in-tests: false
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true # Hibernate가 테이블을 만든 뒤에 db/patch.sql 실행
  sql:
    init:
      mode: always
      schema-locations: classpath:db/patch.sql

logging:
  level:
    org.hibernate.SQL: debug
    org.springframework.security: debug
